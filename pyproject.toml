[project]
name = "dispensario-medico-back"
version = "0.1.0"
description = "API REST para la gestion de un dispensario medico"
readme = "README.md"
authors = [
    { name = "oscarrander26", email = "oscar.rander@outlook.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.150.0",
    "pydantic-settings>=2.16.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
